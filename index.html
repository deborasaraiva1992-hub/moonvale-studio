<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moonvale Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050816;
color:white;
font-family:Georgia, serif;
}

nav{
position:fixed;
top:0;
width:100%;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.35);
backdrop-filter:blur(10px);
z-index:999;
}

.logo{
font-size:1.6rem;
letter-spacing:4px;
font-weight:bold;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:white;
text-decoration:none;
font-size:.9rem;
opacity:.8;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
background:
linear-gradient(
rgba(2,6,23,.65),
rgba(2,6,23,.85)
);
}

.hero-content{
max-width:800px;
}

.hero h1{
font-size:4rem;
margin-bottom:20px;
}

.hero p{
font-size:1.2rem;
opacity:.85;
max-width:650px;
margin:auto;
line-height:1.8;
}

.buttons{
margin-top:40px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:14px 28px;
border:1px solid rgba(255,255,255,.25);
border-radius:50px;
color:white;
text-decoration:none;
}

.section{
padding:120px 30px;
text-align:center;
}

.section h2{
margin-bottom:40px;
font-size:2.2rem;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
height:260px;
border:1px solid rgba(255,255,255,.12);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:1.3rem;
background:rgba(255,255,255,.03);
}

footer{
padding:60px 20px;
text-align:center;
border-top:1px solid rgba(255,255,255,.08);
}

@media(max-width:768px){

.menu{
display:none;
}

.hero h1{
font-size:2.5rem;
}

.hero p{
font-size:1rem;
}

}

</style>
</head>

<body>

<nav>

<div class="logo">
MOONVALE
</div>

<div class="menu">
<a href="#">Ethernia</a>
<a href="#">Fantasy</a>
<a href="#">Lore Library</a>
<a href="#">Artefacts</a>
<a href="#">About</a>
</div>

</nav>

<section class="hero">

<div class="hero-content">

<h1>Between Stars And Stories</h1>

<p>
A collection of worlds, legends, heroes and forgotten memories waiting to be discovered.
</p>

<div class="buttons">
<a class="btn" href="#">Explore Ethernia</a>
<a class="btn" href="#">Explore Fantasy</a>
</div>

</div>

</section>

<section class="section">

<h2>Explore The Worlds</h2>

<div class="cards">

<div class="card">Ethernia</div>

<div class="card">Fantasy</div>

<div class="card">Lore Library</div>

<div class="card">Artefacts</div>

</div>

</section>

<footer>

Moonvale Studio © 2026

</footer>

</body>
</html>
