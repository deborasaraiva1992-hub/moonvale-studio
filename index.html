<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonvale Studio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#08101c;
color:white;
font-family:Georgia,serif;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
z-index:1000;
}

.logo{
font-size:1.2rem;
font-weight:bold;
letter-spacing:2px;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:white;
text-decoration:none;
font-size:.9rem;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.hero-content{
max-width:700px;
}

.hero h1{
font-size:3rem;
margin-bottom:15px;
}

.hero p{
font-size:1.1rem;
opacity:.8;
margin-bottom:30px;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:12px 24px;
border:1px solid rgba(255,255,255,.4);
text-decoration:none;
color:white;
border-radius:50px;
}

.section{
padding:100px 25px;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
height:280px;
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.03);
}

footer{
padding:50px 20px;
text-align:center;
border-top:1px solid rgba(255,255,255,.1);
}

@media(max-width:768px){

.menu{
display:none;
}

.hero h1{
font-size:2rem;
}

}
</style>
</head>

<body>

<nav>
<div class="logo">MOONVALE</div>

<div class="menu">
<a href="#">Ethernia</a>
<a href="#">Fantasy</a>
<a href="#">Lore Library</a>
<a href="#">Artefacts</a>
<a href="#">About</a>
</div>
</nav>

<section class="hero">

<div class="hero-content">

<h1>Between Stars And Stories</h1>

<p>
The worlds of Ethernia and Fantasy await beyond the Astral Sea.
</p>

<div class="buttons">
<a
